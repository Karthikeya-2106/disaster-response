spring:
  application:
    name: disaster-response
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8081}
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForJWTSigningPleaseChangeMe123456}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  upload-dir: ${UPLOAD_DIR:./uploads}

# Free AI providers only. With nothing configured the app uses built-in heuristics.
ai:
  provider: ${AI_PROVIDER:auto}          # auto | gemini | ollama | none  (auto = gemini if a key is set)
  timeout-seconds: ${AI_TIMEOUT_SECONDS:0}   # 0 = auto: 60 s Gemini, 300 s Ollama (CPU photos measured at 130-170 s)
  gemini:
    api-key: ${GEMINI_API_KEY:}          # free key: https://aistudio.google.com/apikey
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta/models/}
  ollama:
    base-url: ${OLLAMA_URL:http://localhost:11434}
    model: "${OLLAMA_MODEL:qwen2.5vl:3b}"   # 3b fits 8 GB RAM; use qwen2.5vl:7b with 16 GB+
    num-ctx: ${OLLAMA_NUM_CTX:0}             # 0 = Ollama default (4096 on CPU-only machines)

logging:
  level:
    com.disaster: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:disaster;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/disaster_db}
    username: ${SPRING_DATASOURCE_USERNAME:disaster}
    password: ${SPRING_DATASOURCE_PASSWORD:disaster123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

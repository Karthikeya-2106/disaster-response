spring:
  application:
    name: disaster-response
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8080
  error:
    include-message: always

jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForJWTSigningPleaseChangeMe123456}
  expiration: 86400000
  refresh-expiration: 604800000

app:
  upload-dir: ${UPLOAD_DIR:./uploads}

anthropic:
  api-key: ${ANTHROPIC_API_KEY:}
  model: claude-haiku-4-5-20251001

logging:
  level:
    com.disaster: INFO
    org.springframework.security: WARN

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:disaster;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/disaster_db}
    username: ${SPRING_DATASOURCE_USERNAME:disaster}
    password: ${SPRING_DATASOURCE_PASSWORD:disaster123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
